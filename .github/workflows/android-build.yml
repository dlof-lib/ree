    runs-on: ubuntu-latest[span_26](start_span)[span_26](end_span)
    if: github.ref == 'refs/heads/main[span_27](start_span)'[span_27](end_span)
    steps:
      - name: Checkout[span_28](start_span)[span_28](end_span)
