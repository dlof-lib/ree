name: Build REE Editor APK[span_0](start_span)[span_0](end_span)

on:
  push:
    branches: [ main ][span_1](start_span)[span_1](end_span)
  pull_request:
    branches: [ main ][span_2](start_span)[span_2](end_span)
  workflow_dispatch:[span_3](start_span)[span_3](end_span)

jobs:
  build:
    runs-on: ubuntu-latest[span_4](start_span)[span_4](end_span)

    steps:
      - name: Checkout[span_5](start_span)[span_5](end_span)
        uses: actions/checkout@v4[span_6](start_span)[span_6](end_span)
        with:
          fetch-depth: 0[span_7](start_span)[span_7](end_span)

      - name: Set up JDK 17[span_8](start_span)[span_8](end_span)
        uses: actions/setup-java@v4[span_9](start_span)[span_9](end_span)
        with:
          distribution: 'temurin[span_10](start_span)'[span_10](end_span)
          java-version: '17[span_11](start_span)'[span_11](end_span)

      - name: Set up Gradle[span_12](start_span)[span_12](end_span)
        uses: gradle/actions/setup-gradle@v3[span_13](start_span)[span_13](end_span)
        with:
          gradle-version: 8.7[span_14](start_span)[span_14](end_span)

      - name: Set up Android SDK[span_15](start_span)[span_15](end_span)
        uses: android-actions/setup-android@v3[span_16](start_span)[span_16](end_span)

      - name: Print Java / Gradle environment[span_17](start_span)[span_17](end_span)
        run: |
          echo "===== java -version ====="
          java -version || true
          echo "===== echo JAVA_HOME ====="
          echo "$JAVA_HOME"
          echo "===== gradle (system) --version ====="
          gradle --version || true
          echo "===== ./gradlew --version (если есть) ====="
          if [ -f android/gradlew ]; then
            (cd android && ./gradlew --version) || true
          fi

      - name: Show android Gradle files (debug)[span_18](start_span)[span_18](end_span)
        run: |
          echo "===== android/settings.gradle ====="
          sed -n '1,200p' android/settings.gradle || true
          echo "===== android/build.gradle ====="
          sed -n '1,200p' android/build.gradle || true
          echo "===== android/app/build.gradle ====="
          sed -n '1,400p' android/app/build.gradle || true
          echo "===== list android dir ====="
          ls -la android || true

      - name: Make Gradle wrapper executable (if present)[span_19](start_span)[span_19](end_span)
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found in android/ — will use installed Gradle from setup-gradle"
          fi

      - name: Build debug APK[span_20](start_span)[span_20](end_span)
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --info --debug
          else
            gradle :app:assembleDebug --no-daemon --stacktrace --info --debug
          fi

      - name: Upload APK artifact[span_21](start_span)[span_21](end_span)
        uses: actions/upload-artifact@v4[span_22](start_span)[span_22](end_span)
        with:
          name: ree-editor-debug-apk[span_23](start_span)[span_23](end_span)
          path: android/app/build/outputs/apk/debug/*.apk[span_24](start_span)[span_24](end_span)

  build-release:
