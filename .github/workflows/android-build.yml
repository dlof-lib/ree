name: Build REE Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: List android directory (debug)
        run: ls -la android || echo "android directory missing"

      - name: Make Gradle wrapper executable (if present)
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found in android/ — will use installed Gradle from setup-gradle"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ree-editor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: List android directory (release)
        run: ls -la android || echo "android directory missing"

      - name: Make Gradle wrapper executable (if present)
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found in android/ — will use installed Gradle from setup-gradle"
          fi

      - name: Build unsigned release APK
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ree-editor-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
