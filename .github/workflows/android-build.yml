name: Build REE Editor APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --- Debugging helpers: print environment and gradle files ---
      - name: Print Java / Gradle environment
        run: |
          echo "===== java -version ====="
          java -version || true
          echo "===== echo JAVA_HOME ====="
          echo "$JAVA_HOME"
          echo "===== gradle (system) --version ====="
          gradle --version || true
          echo "===== ./gradlew --version (if present) ====="
          if [ -f android/gradlew ]; then
            (cd android && ./gradlew --version) || true
          fi

      - name: Show android Gradle files (debug)
        run: |
          echo "===== android/settings.gradle ====="
          sed -n '1,200p' android/settings.gradle || true
          echo "===== android/build.gradle ====="
          sed -n '1,200p' android/build.gradle || true
          echo "===== android/app/build.gradle ====="
          sed -n '1,400p' android/app/build.gradle || true
          echo "===== list android dir ====="
          ls -la android || true
      # --- end debug helpers ---

      - name: Make Gradle wrapper executable (if present)
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found in android/ — will use installed Gradle from setup-gradle"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --info --debug
          else
            gradle :app:assembleDebug --no-daemon --stacktrace --info --debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ree-editor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Show android Gradle files (release debug)
        run: |
          echo "===== android/settings.gradle ====="
          sed -n '1,200p' android/settings.gradle || true
          echo "===== android/build.gradle ====="
          sed -n '1,200p' android/build.gradle || true
          echo "===== android/app/build.gradle ====="
          sed -n '1,400p' android/app/build.gradle || true
          ls -la android || true

      - name: Make Gradle wrapper executable (if present)
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found in android/ — will use installed Gradle from setup-gradle"
          fi

      - name: Build unsigned release APK
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace --info --debug
          else
            gradle :app:assembleRelease --no-daemon --stacktrace --info --debug
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ree-editor-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
